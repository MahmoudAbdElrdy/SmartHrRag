# Secrets come from a local, git-ignored .env file (see .env.example).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}"
    ports:
      - "14333:1433"
    volumes:
      - sql_data:/var/opt/mssql
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      - sqlserver
      - ollama
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=SmartHrRag;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      Ollama__BaseUrl: "http://ollama:11434"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Admin__Password: "${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}"
    ports:
      - "5080:8080"
  # Optional cross-encoder. Off unless Retrieval:Reranker is enabled in appsettings.
  # First start downloads BAAI/bge-reranker-v2-m3 into the volume.
  reranker:
    profiles: ["reranker"]
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    ports:
      - "8081:80"
    volumes:
      - reranker_data:/data
volumes:
  sql_data:
  ollama_data:
  reranker_data:
